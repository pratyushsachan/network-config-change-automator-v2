services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: netchange
      POSTGRES_USER: netchange
      POSTGRES_PASSWORD: netchange
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netchange"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/netchange
      DB_USER: netchange
      DB_PASSWORD: netchange
    ports:
      - "8080:8080"
